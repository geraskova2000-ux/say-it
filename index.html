<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Say the Word — VERSION 6 FIXED</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(135deg, #fff3c4, #d9f7ff, #f8dcff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .game {
      width: min(1100px, 96vw);
      min-height: 680px;
      background: rgba(255, 255, 255, 0.84);
      border: 6px solid #fff;
      border-radius: 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .game::before,
    .game::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      z-index: 0;
    }

    .game::before { top: -80px; left: -60px; }
    .game::after { right: -70px; bottom: -80px; }

    .content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 190px 1fr 190px;
      gap: 24px;
      min-height: 620px;
    }

    .side-panel {
      background: rgba(255, 255, 255, 0.82);
      border-radius: 28px;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.8);
    }

    .label {
      font-size: 24px;
      font-weight: 900;
      color: #5e4b8b;
      text-align: center;
    }

    .lives {
      font-size: 34px;
      line-height: 1.35;
      text-align: center;
      word-break: break-word;
    }

    .score {
      font-size: 54px;
      font-weight: 900;
      color: #ff8a00;
    }

    .progress {
      font-size: 28px;
      font-weight: 900;
      color: #4c6fff;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      color: #ff65a3;
      text-shadow: 3px 3px 0 #fff;
      text-align: center;
    }

    .hint-btn {
      border: none;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      color: #5e4b00;
      background: #ffd23f;
      box-shadow: 0 6px 0 rgba(0,0,0,0.14);
      transition: 0.12s ease;
      font-family: inherit;
    }

    .version {
      text-align: center;
      font-size: 14px;
      color: #999;
      font-weight: 800;
      margin-top: 4px;
    }

    .instruction {
      font-size: 25px;
      font-weight: 900;
      color: #4c6fff;
      text-align: center;
      min-height: 34px;
    }

    .card {
      width: min(440px, 74vw);
      height: 310px;
      border-radius: 36px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.14);
      border: 7px solid #ffd86b;
      transition: 0.25s ease;
      padding: 18px;
    }

    .card.listening {
      border-color: #8b5cf6;
      box-shadow: 0 18px 42px rgba(139, 92, 246, 0.28);
    }

    .card.correct {
      border-color: #6ee27a;
      transform: scale(1.04) rotate(-1deg);
      box-shadow: 0 20px 45px rgba(37, 197, 90, 0.35);
    }

    .picture {
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emoji {
      font-size: 150px;
      line-height: 1;
      filter: drop-shadow(0 8px 4px rgba(0, 0, 0, 0.09));
    }

    .word-image {
      max-width: 230px;
      max-height: 230px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 6px rgba(0, 0, 0, 0.12));
    }

    .answer-word {
      margin-top: 10px;
      font-size: 36px;
      color: #5e4b8b;
      font-weight: 900;
      min-height: 44px;
      text-align: center;
    }

    .recording-box {
      width: min(620px, 84vw);
      min-height: 86px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.78);
      padding: 14px 18px;
      text-align: center;
      font-size: 25px;
      font-weight: 900;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border: 3px dashed #b9b9ff;
    }

    .mic {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #bdbdbd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      color: #fff;
      position: relative;
      flex: 0 0 auto;
    }

    .mic.on {
      background: #ff4f8b;
      animation: pulse 1s infinite;
    }

    .mic.on::after {
      content: "";
      position: absolute;
      inset: -8px;
      border: 4px solid rgba(255, 79, 139, 0.35);
      border-radius: 50%;
      animation: ring 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes ring {
      0% { transform: scale(0.85); opacity: 1; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    .wave {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 36px;
    }

    .bar {
      width: 8px;
      height: 12px;
      border-radius: 99px;
      background: #8b5cf6;
      opacity: 0.35;
    }

    .recording .bar {
      animation: sound 0.8s infinite ease-in-out;
      opacity: 1;
    }

    .recording .bar:nth-child(2) { animation-delay: 0.08s; }
    .recording .bar:nth-child(3) { animation-delay: 0.16s; }
    .recording .bar:nth-child(4) { animation-delay: 0.24s; }
    .recording .bar:nth-child(5) { animation-delay: 0.32s; }

    @keyframes sound {
      0%, 100% { height: 12px; }
      50% { height: 34px; }
    }

    .status-text {
      min-width: 190px;
      text-align: left;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .main-btn {
      border: none;
      border-radius: 22px;
      padding: 16px 26px;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      color: white;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.16);
      transition: 0.12s ease;
      font-family: inherit;
    }

    button:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.16);
    }

    .start-btn { background: #ff65a3; }
    .stop-btn { background: #ff4b4b; }
    .skip-btn { background: #ffb13b; }

    .small-note {
      font-size: 17px;
      text-align: center;
      color: #666;
      max-width: 620px;
      line-height: 1.35;
    }

    .attempts {
      font-size: 22px;
      font-weight: 900;
      color: #8b5cf6;
      text-align: center;
    }

    .hidden { display: none !important; }

    .sparkle {
      position: absolute;
      font-size: 30px;
      animation: fly 0.9s ease forwards;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes fly {
      0% { opacity: 1; transform: translateY(0) scale(0.6) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.5) rotate(35deg); }
    }

    .end-screen {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.94);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 30px;
      text-align: center;
    }

    .end-screen h2 {
      margin: 0;
      font-size: 64px;
      color: #ff65a3;
    }

    .end-screen p {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
      color: #5e4b8b;
    }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .game { min-height: 100vh; border-radius: 0; width: 100vw; }
      .content { grid-template-columns: 1fr; }
      .side-panel { flex-direction: row; justify-content: center; min-height: 80px; }
      .left-panel { order: 1; }
      .main { order: 2; }
      .right-panel { order: 3; }
      .emoji { font-size: 120px; }
      .picture { width: 170px; height: 170px; }
      .word-image { max-width: 175px; max-height: 175px; }
      .card { height: 255px; }
      .status-text { min-width: 130px; }
    }
  </style>
</head>
<body>

<div id="nameScreen" style="
position:fixed;
inset:0;
background:linear-gradient(135deg, #fff3c4, #d9f7ff, #f8dcff);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
gap:20px;
font-family:'Comic Sans MS', Arial, sans-serif;
">

<h1 style="font-size:56px;color:#ff65a3;margin:0;">What is your name?</h1>

<input
id="studentName"
placeholder="Write your name"
style="
font-size:30px;
padding:16px 22px;
border-radius:20px;
border:4px solid #222;
width:320px;
text-align:center;
"
>

<button
onclick="enterGame()"
style="
font-size:32px;
padding:16px 36px;
border-radius:22px;
border:4px solid #222;
background:#ff65a3;
color:white;
cursor:pointer;
font-weight:900;
"
>
Start
</button>

</div>

  <div class="game">
    <div class="content">
      <aside class="side-panel left-panel">
        <div class="label">Lives</div>
        <div id="lives" class="lives">❤️❤️❤️❤️❤️</div>
      </aside>

      <main class="main">
        <div>
          <div class="top-row">
            <h1>Say the Word!</h1>
            <button class="hint-btn" id="hintBtn" title="Show word">💡</button>
          </div>
          <div class="version">VERSION 6 FIXED — AUTO RECORDING + HINT</div>
          <div id="instruction" class="instruction">Look at the picture and say the word.</div>
        </div>

        <div id="card" class="card">
          <div id="picture" class="picture"></div>
          <div id="answerWord" class="answer-word"></div>
        </div>

        <div id="recordingBox" class="recording-box">
          <div id="micIcon" class="mic">🎤</div>
          <div id="wave" class="wave">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          </div>
          <div id="statusText" class="status-text">Press Start</div>
        </div>

        <div class="attempts" id="attempts">Try: 0 / 3</div>

        <div class="buttons">
          <button class="main-btn start-btn" id="startBtn">▶ Start</button>
          <button class="main-btn stop-btn hidden" id="stopBtn">⏹ Stop</button>
          <button class="main-btn skip-btn hidden" id="skipBtn">➡ Skip</button>
        </div>

        <div class="small-note">
          Press Start once. Allow microphone. Then say the word you see in the picture.
        </div>
      </main>

      <aside class="side-panel right-panel">
        <div class="label">Score</div>
        <div id="score" class="score">0</div>
        <div id="progress" class="progress">0 / 14</div>
      </aside>
    </div>

    <div id="endScreen" class="end-screen hidden">
      <h2>Great job! ⭐</h2>
      <p id="finalScore">Your score: 0</p>
      <button class="main-btn start-btn" id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbze5szpz0ury7t9AzXgypraI0bqWnb_beGCryE4gfIZTJ8y7giHTQP54U3Mqy6PtOh-Cg/exec";
let studentName = "";

function enterGame(){
  const input = document.getElementById("studentName");
  studentName = input.value.trim();

  if(!studentName){
    alert("Write your name!");
    return;
  }

  document.getElementById("nameScreen").style.display = "none";

  fetch(SCRIPT_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{
      "Content-Type":"application/x-www-form-urlencoded"
    },
    body:new URLSearchParams({
      name:studentName,
      game:"Say the Word",
      page:window.location.href
    })
  });
}

//9cZKo/AAAABklEQVQDADF79z9LyilcAAAAAElFTkSuQmCC";

    const WORDS = [
      { word: "umbrella", icon: "☔", accepts: ["umbrella", "umbrellah", "umbraila"] },
      { word: "bag", icon: "🎒", accepts: ["bag", "back", "beg"] },
      { word: "glue", image: GLUE_IMAGE, accepts: ["glue", "blue", "glu", "glew"] },
      { word: "ball", icon: "⚽", accepts: ["ball", "bol", "bowl"] },
      { word: "pencil", icon: "✏️", accepts: ["pencil", "pensil", "pensel", "pencel"] },
      { word: "pencil case", icon: "👝", accepts: ["pencil case", "pensil case", "pencilcase", "pencil-case"] },
      { word: "rubber", image: RUBBER_IMAGE, accepts: ["rubber", "ruber", "rabber", "eraser"] },
      { word: "apple", icon: "🍎", accepts: ["apple", "aple", "appel"] },
      { word: "pen", icon: "🖊️", accepts: ["pen", "pan", "pin"] },
      { word: "paintbrush", icon: "🖌️", accepts: ["paintbrush", "paint brush", "pain brush"] },
      { word: "paint", icon: "🎨", accepts: ["paint", "painte", "pent"] },
      { word: "present", icon: "🎁", accepts: ["present", "prezent", "prisent", "gift"] },
      { word: "picture", icon: "🖼️", accepts: ["picture", "pikture", "piccher", "photo"] },
      { word: "ruler", icon: "📏", accepts: ["ruler", "rula", "ruller"] }
    ];

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    const pictureEl = document.getElementById("picture");
    const answerWordEl = document.getElementById("answerWord");
    const recordingBox = document.getElementById("recordingBox");
    const micIcon = document.getElementById("micIcon");
    const wave = document.getElementById("wave");
    const statusText = document.getElementById("statusText");
    const livesEl = document.getElementById("lives");
    const scoreEl = document.getElementById("score");
    const progressEl = document.getElementById("progress");
    const attemptsEl = document.getElementById("attempts");
    const cardEl = document.getElementById("card");
    const instructionEl = document.getElementById("instruction");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const skipBtn = document.getElementById("skipBtn");
    const hintBtn = document.getElementById("hintBtn");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const endScreen = document.getElementById("endScreen");
    const finalScore = document.getElementById("finalScore");

    let deck = [];
    let currentIndex = 0;
    let score = 0;
    let lives = 5;
    let attempts = 0;
    let recognition = null;
    let isListening = false;
    let gameIsActive = false;
    let ignoreNextEnd = false;
    let moveTimer = null;
    let micStream = null;

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function normalize(text) {
      return text
        .toLowerCase()
        .replace(/[.,!?;:]/g, "")
        .replace(/-/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function levenshtein(a, b) {
      const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) matrix[i][j] = matrix[i - 1][j - 1];
          else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
        }
      }
      return matrix[b.length][a.length];
    }

    function isCloseEnough(heard, targetData) {
      const heardText = normalize(heard);
      const acceptable = targetData.accepts.map(normalize);
      const target = normalize(targetData.word);
      if (!heardText) return false;

      if (acceptable.some(item => heardText === item || heardText.includes(item))) return true;

      const allTargets = [target, ...acceptable];
      return allTargets.some(item => {
        const distance = levenshtein(heardText, item);
        if (item.length <= 3) return distance === 0;
        if (item.length <= 6) return distance <= 1;
        return distance <= 2;
      });
    }

    function renderPicture(item) {
      if (item.image) {
        pictureEl.innerHTML = `<img class="word-image" src="${item.image}" alt="${item.word}">`;
      } else {
        pictureEl.innerHTML = `<div class="emoji">${item.icon}</div>`;
      }
    }

    function currentWord() {
      return deck[currentIndex];
    }

    function showHint() {
      const item = currentWord();
      if (!item) return;
      answerWordEl.textContent = item.word.toUpperCase();
    }

    function setRecordingUI(isOn, text) {
      micIcon.classList.toggle("on", isOn);
      wave.classList.toggle("recording", isOn);
      recordingBox.classList.toggle("recording", isOn);
      cardEl.classList.toggle("listening", isOn);
      statusText.textContent = text;
    }

    function updateUI() {
      livesEl.textContent = "❤️".repeat(lives) + "🤍".repeat(5 - lives);
      scoreEl.textContent = score;
      progressEl.textContent = deck.length ? `${Math.min(currentIndex + 1, deck.length)} / ${deck.length}` : `0 / ${WORDS.length}`;
      attemptsEl.textContent = `Try: ${attempts} / 3`;
    }

    async function askMicrophoneOnce() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }

    function setupRecognition() {
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.continuous = true;
      recognition.maxAlternatives = 5;

      recognition.onstart = () => {
        isListening = true;
        setRecordingUI(true, "Recording...");
      };

      recognition.onend = () => {
        isListening = false;
        setRecordingUI(false, "Paused");

        if (gameIsActive && !ignoreNextEnd) {
          clearTimeout(moveTimer);
          moveTimer = setTimeout(() => startListening(), 250);
        }
      };

      recognition.onerror = (event) => {
        isListening = false;
        setRecordingUI(false, "Start again");
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          instructionEl.textContent = "Microphone is blocked. Allow it in browser settings.";
          gameIsActive = false;
          startBtn.classList.remove("hidden");
          stopBtn.classList.add("hidden");
          skipBtn.classList.add("hidden");
        }
      };

      recognition.onresult = (event) => {
        if (!gameIsActive || currentIndex >= deck.length) return;

        const item = currentWord();
        let accepted = false;

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const alternatives = Array.from(event.results[i]).map(result => result.transcript);
          if (alternatives.some(text => isCloseEnough(text, item))) {
            accepted = true;
            break;
          }
        }

        if (accepted) correctAnswer();
      };
    }

    async function startGame() {
      if (!SpeechRecognition) {
        statusText.textContent = "Use Chrome or Edge";
        instructionEl.textContent = "Speech recognition does not work in this browser.";
        return;
      }

      try {
        statusText.textContent = "Allow microphone...";
        await askMicrophoneOnce();
      } catch (e) {
        statusText.textContent = "Microphone blocked";
        instructionEl.textContent = "Please allow microphone access and press Start again.";
        return;
      }

      deck = shuffle(WORDS);
      currentIndex = 0;
      score = 0;
      lives = 5;
      attempts = 0;
      gameIsActive = true;
      ignoreNextEnd = false;
      endScreen.classList.add("hidden");
      startBtn.classList.add("hidden");
      stopBtn.classList.remove("hidden");
      skipBtn.classList.remove("hidden");

      setupRecognition();
      showWord();
      startListening();
    }

    function showWord() {
      clearTimeout(moveTimer);

      if (currentIndex >= deck.length || lives <= 0) {
        finishGame();
        return;
      }

      const item = currentWord();
      attempts = 0;
      renderPicture(item);
      answerWordEl.textContent = "";
      instructionEl.textContent = "Say the word.";
      cardEl.classList.remove("correct");
      setRecordingUI(isListening, isListening ? "Recording..." : "Starting...");
      updateUI();
    }

    function startListening() {
      if (!recognition || isListening || !gameIsActive) return;
      try {
        ignoreNextEnd = false;
        recognition.start();
      } catch (error) {
        clearTimeout(moveTimer);
        moveTimer = setTimeout(() => startListening(), 350);
      }
    }

    function stopListeningOnly() {
      ignoreNextEnd = true;
      if (recognition && isListening) {
        try { recognition.stop(); } catch (e) {}
      }
      isListening = false;
      setRecordingUI(false, "Stopped");
    }

    function correctAnswer() {
      clearTimeout(moveTimer);
      const item = currentWord();
      score++;
      answerWordEl.textContent = item.word.toUpperCase();
      instructionEl.textContent = "Correct! ⭐";
      setRecordingUI(true, "Correct! ✅");
      cardEl.classList.add("correct");
      createSparkles();
      updateUI();

      currentIndex++;
      moveTimer = setTimeout(() => {
        showWord();
        if (!isListening) startListening();
      }, 950);
    }

    function skipWord() {
      if (currentIndex >= deck.length) return;
      clearTimeout(moveTimer);
      const item = currentWord();
      answerWordEl.textContent = item.word.toUpperCase();
      instructionEl.textContent = "Skipped. Next word!";
      currentIndex++;
      updateUI();
      moveTimer = setTimeout(() => {
        showWord();
        if (!isListening) startListening();
      }, 800);
    }

    function stopGame() {
      gameIsActive = false;
      clearTimeout(moveTimer);
      stopListeningOnly();
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }
      startBtn.classList.remove("hidden");
      stopBtn.classList.add("hidden");
      skipBtn.classList.add("hidden");
      instructionEl.textContent = "Stopped.";
    }

    function finishGame() {
      gameIsActive = false;
      clearTimeout(moveTimer);
      stopListeningOnly();
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }
      finalScore.textContent = `Your score: ${score} / ${deck.length}`;
      endScreen.classList.remove("hidden");
      startBtn.classList.remove("hidden");
      stopBtn.classList.add("hidden");
      skipBtn.classList.add("hidden");
    }

    function createSparkles() {
      const symbols = ["⭐", "✨", "🌟", "💫"];
      const game = document.querySelector(".game");
      for (let i = 0; i < 12; i++) {
        const sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        sparkle.style.left = `${35 + Math.random() * 30}%`;
        sparkle.style.top = `${35 + Math.random() * 30}%`;
        sparkle.style.animationDelay = `${Math.random() * 0.25}s`;
        game.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1200);
      }
    }

    startBtn.addEventListener("click", startGame);
    stopBtn.addEventListener("click", stopGame);
    skipBtn.addEventListener("click", skipWord);
    hintBtn.addEventListener("click", showHint);
    playAgainBtn.addEventListener("click", startGame);

    deck = WORDS;
    renderPicture(WORDS[0]);
    updateUI();
  </script>
